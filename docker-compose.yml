# ============================================================================
# HMS Platform - Docker Compose Configuration
# Development environment setup
# ============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hms-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hms_user:${POSTGRES_PASSWORD:-hms_secret_2024}@db:5432/hms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_2024}@redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot-reload for development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - hms-network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hms-postgres
    environment:
      POSTGRES_DB: hms_db
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_secret_2024}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hms-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret_2024}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Orthanc PACS Server (DICOM)
  # ---------------------------------------------------------------------------
  orthanc:
    image: jodogne/orthanc:latest
    container_name: hms-orthanc
    ports:
      - "8042:8042"  # Web interface
      - "4242:4242"  # DICOM port
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    environment:
      ORTHANC__NAME: "HMS PACS Server"
      ORTHANC__DICOM_AET: "HMS_ORTHANC"
      ORTHANC__DICOM_PORT: 4242
      ORTHANC__HTTP_PORT: 8042
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"admin": "orthanc_admin_2024"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    networks:
      - hms-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Adminer - Database Management (Development Only)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: hms-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hms-network
    restart: unless-stopped
    profiles:
      - dev

# =============================================================================
# Networks
# =============================================================================
networks:
  hms-network:
    driver: bridge
    name: hms-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  orthanc_data:
    driver: local
