# ============================================================================
# HMS Platform - Docker Compose Production Overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Backend API Service - Production overrides
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        BUILD_ENV: production
    volumes: []  # No code mounting in production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--no-access-log"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      replicas: 2
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "hms-backend"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database - Production overrides
  # ---------------------------------------------------------------------------
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set via env
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports: []  # Don't expose DB port in production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "hms-postgres"
    # In production, consider using a managed database service:
    # - AWS RDS for PostgreSQL
    # - Google Cloud SQL
    # - Azure Database for PostgreSQL
    # SSL Configuration:
    # volumes:
    #   - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
    #   - ./certs/server.key:/var/lib/postgresql/server.key:ro
    # command: >
    #   postgres
    #   -c ssl=on
    #   -c ssl_cert_file=/var/lib/postgresql/server.crt
    #   -c ssl_key_file=/var/lib/postgresql/server.key

  # ---------------------------------------------------------------------------
  # Redis Cache - Production overrides
  # ---------------------------------------------------------------------------
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --protected-mode yes
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    ports: []  # Don't expose Redis port in production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "hms-redis"
    # TLS Configuration:
    # command: >
    #   redis-server
    #   --tls-port 6379
    #   --port 0
    #   --tls-cert-file /tls/redis.crt
    #   --tls-key-file /tls/redis.key
    #   --tls-ca-cert-file /tls/ca.crt

  # ---------------------------------------------------------------------------
  # Orthanc PACS Server - Production overrides
  # ---------------------------------------------------------------------------
  orthanc:
    environment:
      ORTHANC__REMOTE_ACCESS_ALLOWED: "false"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
    ports:
      - "4242:4242"  # Only DICOM port, no web UI exposed
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "hms-orthanc"

  # Adminer is NOT included in production (profiles: dev prevents it)
