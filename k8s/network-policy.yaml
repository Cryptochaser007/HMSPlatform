apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hms-network-policy
  namespace: hms-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow backend to accept from ingress and namespace
    - from:
        - podSelector:
            matchLabels:
              app: hms-backend
  egress:
    # Allow backend to connect to database, redis, and DNS
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

